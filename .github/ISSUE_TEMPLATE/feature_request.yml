name: Feature or task
description: Propose a focused change with scope and acceptance criteria.
labels: ["enhancement"]
body:
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: What user or system problem does this solve?
    validations:
      required: true
  - type: textarea
    id: scope
    attributes:
      label: Scope
      description: Owning module, affected contracts, and what is out of scope.
    validations:
      required: true
  - type: textarea
    id: acceptance
    attributes:
      label: Acceptance criteria
      placeholder: |
        - [ ] ...
    validations:
      required: true
  - type: textarea
    id: security
    attributes:
      label: Security considerations
      description: Authorization, tenant isolation, secrets, untrusted input, or "None".
