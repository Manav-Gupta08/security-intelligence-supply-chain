spring.application.name=backend

# Datasource and Redis come from SPRING_DATASOURCE_* and SPRING_DATA_REDIS_* environment variables.
spring.jpa.open-in-view=false
spring.jpa.hibernate.ddl-auto=none

server.error.include-stacktrace=never
server.error.include-message=never
server.error.include-binding-errors=never

logging.pattern.correlation=[%X{correlationId:-}] 

management.endpoints.web.exposure.include=health
management.endpoint.health.show-details=never
management.endpoint.health.probes.enabled=true

springdoc.paths-to-match=/api/**
springdoc.api-docs.enabled=${SECINTEL_API_DOCS_ENABLED:true}
springdoc.swagger-ui.enabled=${SECINTEL_API_DOCS_ENABLED:true}

secintel.github.webhook.secret=${GITHUB_WEBHOOK_SECRET:}
secintel.github.webhook.max-payload-size=25MB
